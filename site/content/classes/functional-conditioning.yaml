name:
  en: Functional Conditioning
  ar: التدريب الوظيفي
order: 4
description:
  en: >-
    Sleds, carries, kettlebells and bodyweight work on the turf. Full body,
    moderate load, moving the whole way through. It is the closest thing here to
    carrying something heavy up a flight of stairs and not being wrecked by it.
  ar: >-
    زلّاجات وحمل وكتل حديدية وتمارين بوزن الجسم على العشب. الجسم كله، وحمل
    متوسط، وحركة متواصلة من البداية إلى النهاية. أقرب ما يكون إلى أن تحمل شيئاً
    ثقيلاً درجاً كاملاً ثم تصل دون أن تنهار.
suitsWho:
  en: >-
    People who already lift and want one session in the week that isn't lifting.
    Also anyone whose training has become nothing but machines.
  ar: >-
    لمن يرفع الحديد أصلاً ويريد حصة واحدة في الأسبوع ليست رفع حديد. ولمن صار
    تمرينه كله أجهزة ولا شيء غيرها.
