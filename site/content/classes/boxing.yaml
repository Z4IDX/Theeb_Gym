name:
  en: Boxing Conditioning
  ar: لياقة الملاكمة
order: 3
description:
  en: >-
    Stance, footwork, pads and bag rounds. Technique is taught first and the
    conditioning is built on top of it, because throwing a thousand bad punches
    is just a way to hurt your wrist. There is no sparring.
  ar: >-
    وقفة وحركة قدمين وجولات على الباد والكيس. التقنية تُعلَّم أولاً ثم تُبنى
    اللياقة فوقها، لأن ألف لكمة خاطئة ليست إلا طريقة لإصابة رسغك. ولا يوجد
    نزال.
suitsWho:
  en: >-
    Beginners are welcome and nobody is put in front of a bag they can't handle.
    Also good for lifters who have never had to move their feet.
  ar: >-
    المبتدئون مرحّب بهم، ولا يوضع أحد أمام كيس لا يقدر عليه. ومفيدة أيضاً لمن
    يرفع الحديد ولم يضطر يوماً لتحريك قدميه.
