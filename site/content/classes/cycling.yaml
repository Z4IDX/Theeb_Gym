name:
  en: Cycling
  ar: الدرّاجات
order: 2
description:
  en: >-
    A room of bikes, a coach on the front one, and resistance called out from
    the front. Hard work with almost nothing landing on your knees or your back,
    which is the whole reason the room exists.
  ar: >-
    قاعة كاملة من الدرّاجات، ومدرّب على الدرّاجة الأمامية، ومقاومة تُطلب من
    المقدمة. مجهود عالٍ دون أن يقع منه شيء تقريباً على ركبتيك أو ظهرك، وهذا
    سبب وجود القاعة أصلاً.
suitsWho:
  en: >-
    Good if running bothers your knees, and good as a second session on a
    lifting day when you still want the heart rate up.
  ar: >-
    مناسبة إن كان الجري يتعب ركبتيك، ومناسبة كحصة ثانية في يوم الحديد حين تريد
    رفع النبض دون إرهاق إضافي للمفاصل.
