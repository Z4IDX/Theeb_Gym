name:
  en: Mobility & Stretch
  ar: المرونة والإطالة
order: 5
description:
  en: >-
    Guided stretching and joint work, taken slowly. Hips, shoulders, ankles and
    the mid-back — the four places that quietly decide how much weight you can
    hold a decent position under.
  ar: >-
    إطالة موجّهة وعمل على المفاصل، ببطء. الحوض والكتفان والكاحلان وأعلى الظهر —
    المواضع الأربعة التي تقرّر بصمت كم وزناً تستطيع أن تحمله بوضعية سليمة.
suitsWho:
  en: >-
    Anyone training heavy through the week, and anyone who sits at a desk for
    eight hours before they get here.
  ar: >-
    لمن يتمرّن بثقل خلال الأسبوع، ولمن يجلس إلى مكتب ثماني ساعات قبل أن يصل إلى
    هنا.
