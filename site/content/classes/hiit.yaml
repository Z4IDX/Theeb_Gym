name:
  en: HIIT
  ar: تدريب متقطّع عالي الشدّة
order: 1
description:
  en: >-
    Work intervals against a clock, with the load kept light on purpose. The
    difficulty is the pace, not the weight, and the coach calls every change so
    you are never deciding how hard to go while you are already out of breath.
  ar: >-
    فترات عمل مضبوطة على الساعة، والوزن خفيف بشكل مقصود. الصعوبة في الإيقاع لا
    في الحديد، والمدرّب يعلن كل تبديل بنفسه، فلا تجد نفسك تقرّر شدّة التمرين
    وأنت أصلاً بلا نفَس.
suitsWho:
  en: >-
    Anyone with a base of fitness who wants conditioning work without having to
    program it themselves. Not the first thing to try in your first week.
  ar: >-
    لمن لديه أساس لياقة ويريد تمرين تحمّل جاهزاً دون أن يصمّمه بنفسه. وليست
    الحصة التي تبدأ بها أسبوعك الأول.
