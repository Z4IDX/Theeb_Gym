name:
  en: Showers
  ar: الحمّامات والدشّات
order: 5
body:
  en: >-
    Hot showers in the changing rooms, cleaned through the day rather than once
    before opening.


    Theeb is a mixed gym. The training floor is shared, and there are separate
    changing rooms with their own showers for men and for women.
  ar: >-
    دشّات بماء ساخن في غرف التبديل، تُنظَّف على مدار اليوم لا مرة واحدة قبل
    الافتتاح.


    الذيب نادٍ مختلط. صالة التدريب مشتركة، وهناك غرف تبديل منفصلة بدشّاتها
    الخاصة للرجال وللنساء.
