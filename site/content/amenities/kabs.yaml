name:
  en: KABS Supplement Store
  ar: متجر KABS للمكمّلات
order: 2
body:
  en: >-
    KABS runs a store on the ground floor. Protein, creatine and everything
    between, bought over a counter you can actually ask questions at.


    You pick it up on the way out rather than making a separate trip across
    town for it.
  ar: >-
    يدير KABS متجره في الطابق الأرضي. بروتين وكرياتين وكل ما بينهما، تشتريه من
    كاونتر تستطيع أن تسأل فيه فعلاً.


    تأخذه وأنت في طريقك للخارج، بدل رحلة منفصلة تقطع فيها المدينة من أجله.
