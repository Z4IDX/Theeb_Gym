name:
  en: Parking
  ar: المواقف
order: 4
body:
  en: >-
    On-site parking in front of the entrance, with space left at the busiest
    hours. Nobody should spend ten minutes finding a space for a sixty-minute
    session.
  ar: >-
    مواقف داخل الموقع أمام المدخل، ويبقى فيها متسع في أكثر الساعات ازدحاماً. لا
    أحد يستحق أن يقضي عشر دقائق في البحث عن موقف من أجل تمرين ساعة.
