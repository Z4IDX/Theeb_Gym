name:
  en: Lockers
  ar: الخزائن
order: 6
body:
  en: >-
    Lockers in both changing rooms, including a dedicated women's locker room
    with its own showers.


    Take one for the session and give the key back on the way out. Nothing to
    reserve, and nothing you have to carry onto the floor with you.
  ar: >-
    خزائن في غرفتَي التبديل، ومنها غرفة خزائن مخصّصة للنساء بدشّاتها الخاصة.


    خذ خزانة طوال التمرين وأعد المفتاح عند الخروج. لا حجز مسبق، ولا أغراض تضطر
    لحملها معك إلى الصالة.
