name:
  en: Barber
  ar: الحلاق
order: 3
body:
  en: >-
    A barber shop in the building. Train, shower, sit down, and leave looking
    like you spent the evening somewhere else entirely.
  ar: >-
    صالون حلاقة داخل المبنى. تتمرّن، وتستحمّ، وتجلس على الكرسي، ثم تخرج وكأنك
    قضيت سهرتك في مكان آخر تماماً.
