name:
  en: Theeb Coffee House
  ar: مقهى الذيب
order: 1
body:
  en: >-
    A proper coffee house inside the building — not a fridge and a shaker in the
    corner of reception. Espresso, filter, and food that fits either side of a
    session.


    It is the reason people stay. You finish, you sit down, and an hour goes by
    before anyone thinks about leaving.
  ar: >-
    مقهى حقيقي داخل المبنى — لا ثلّاجة وشيكر في ركن الاستقبال. إسبريسو وقهوة
    مقطّرة وطعام يناسب ما قبل التمرين وما بعده.


    وهو سبب بقاء الناس. تنتهي من تمرينك فتجلس، وتمضي ساعة قبل أن يفكّر أحد
    بالمغادرة.
