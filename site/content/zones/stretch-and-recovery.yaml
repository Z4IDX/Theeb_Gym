name:
  en: Stretching & Recovery
  ar: الإطالة والاستشفاء
order: 7
summary:
  en: >-
    Mats, bands, rollers and floor space set away from the traffic, so warming
    up and cooling down doesn't happen in a corridor with people stepping over
    you.
  ar: >-
    فرشات وأحزمة مطاطية وأسطوانات تدليك ومساحة أرضية بعيدة عن حركة الناس، حتى
    لا يكون الإحماء والتهدئة في ممرّ يتخطّاك فيه الآخرون.
equipment:
  - en: Stretching mats
    ar: فرشات إطالة
  - en: Resistance and mobility bands
    ar: أحزمة مقاومة ومرونة
  - en: Foam rollers
    ar: أسطوانات تدليك
  - en: Massage guns
    ar: أجهزة تدليك اهتزازي
  - en: Ab and back extension benches
    ar: بنش بطن وبنش تمديد ظهر
  - en: Wall bars and stretching frames
    ar: أعمدة حائط وإطارات إطالة
