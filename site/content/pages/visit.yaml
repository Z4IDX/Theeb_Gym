metaDescription:
  en: >-
    Theeb Gym is in Marj Al-Hamam, Amman. Open 6am to 2am, Friday 2pm to 8pm.
    Parking on site. Directions, hours and WhatsApp.
  ar: >-
    نادي الذيب في مرج الحمام، عمّان. مفتوح من السادسة صباحاً حتى الثانية فجراً،
    والجمعة من الثانية ظهراً حتى الثامنة مساءً. مواقف داخل الموقع.
intro:
  eyebrow:
    en: Marj Al-Hamam, Amman
    ar: مرج الحمام، عمّان
  headline:
    en: Come and look at the floor.
    ar: تعال وشوف الصالة بنفسك.
  body:
    en: >-
      No appointment and no form. The doors are open twenty hours a day, and
      you're welcome to walk in and see the place before you decide anything.


      If you'd like someone to meet you at the entrance, send a message first
      and we'll know to expect you.
    ar: >-
      لا موعد ولا نموذج. الأبواب مفتوحة عشرين ساعة في اليوم، ويسعدنا أن تدخل
      وترى المكان قبل أن تقرّر أي شيء.


      وإن أحببت أن يستقبلك أحدنا عند المدخل، أرسل رسالة قبل مجيئك لنكون في
      انتظارك.
directions:
  headline:
    en: Getting here
    ar: كيف تصل
  body:
    en: >-
      Theeb Gym is in Marj Al-Hamam, on the south-western side of Amman. Use the
      map pin rather than searching the name — the pin puts you at the entrance.


      Coming from inside Amman, the drive out is straightforward and the last
      stretch is on a main road. The building carries the Theeb lockup on the
      façade, lit after dark, so you will see it before you reach it.
    ar: >-
      نادي الذيب في مرج الحمام، في الجهة الجنوبية الغربية من عمّان. استخدم
      الدبوس على الخريطة بدل البحث بالاسم — الدبوس يضعك عند المدخل مباشرة.


      قادماً من داخل عمّان، الطريق مباشر والمقطع الأخير منه على شارع رئيسي.
      وتحمل الواجهة شعار الذيب مضاءً بعد الغروب، فتراه قبل أن تصل إليه.
parking:
  headline:
    en: Parking
    ar: المواقف
  body:
    en: >-
      Parking is on site, in front of the building, and there is space at peak
      hours. You are not circling the street at eight in the evening, and you
      are not walking back to the car in the dark from two blocks away.
    ar: >-
      المواقف داخل الموقع أمام المبنى، وفيها متسع في ساعات الذروة. لن تدور في
      الشارع في الثامنة مساءً، ولن تعود إلى سيارتك في العتمة من شارعين بعيداً.
fridayNote:
  en: >-
    Friday is the one day that breaks the pattern. The gym opens at 2:00 pm and
    closes at 8:00 pm. Every other day of the week it is 6:00 am to 2:00 am.
  ar: >-
    الجمعة هي اليوم الوحيد الذي يخرج عن النمط. النادي يفتح الثانية ظهراً ويغلق
    الثامنة مساءً. وبقية أيام الأسبوع من السادسة صباحاً حتى الثانية فجراً.
tourNote:
  en: >-
    If you'd rather be shown around than wander on your own, ask for a tour when
    you message. Someone will walk you through the zones and answer whatever you
    want to ask.
  ar: >-
    وإن كنت تفضّل أن يرافقك أحد بدل أن تتجوّل وحدك، اطلب جولة حين تراسلنا.
    سيمرّ بك أحدنا على المناطق ويجيب عن كل ما تريد أن تسأل عنه.
