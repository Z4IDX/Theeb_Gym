metaDescription:
  en: >-
    Theeb Gym, Marj Al-Hamam: 2,000 m² of floor, 250+ machines from 14 global
    brands, and a coffee house, supplement store and barber under the same roof.
    Open 6am to 2am.
  ar: >-
    نادي الذيب في مرج الحمام: 2000 م² من الصالات، وأكثر من 250 جهازاً من 14 علامة
    عالمية، ومقهى ومتجر مكمّلات وحلاق تحت السقف نفسه. مفتوح من السادسة صباحاً
    حتى الثانية فجراً.
hero:
  eyebrow:
    en: Marj Al-Hamam, Amman
    ar: مرج الحمام، عمّان
  headline:
    en: Built to a judge's standard.
    ar: بمعيار حَكَم دولي.
  subhead:
    en: >-
      Two thousand square metres. More than 250 machines from 14 global brands.
      Doors open at six in the morning and close at two the next. Founded and
      run by Ahmad Al-Nawaiseh, an international judge for the IFBB Pro League.
    ar: >-
      ألفا متر مربع. أكثر من 250 جهازاً من 14 علامة عالمية. الأبواب تفتح السادسة
      صباحاً وتغلق الثانية بعد منتصف الليل. أسّسه ويديره أحمد النوايسة، حكم دولي
      في IFBB Pro League.
authority:
  kicker:
    en: Who built this floor
    ar: من بنى هذه الصالة
  headline:
    en: The standard is set by someone who judges the sport.
    ar: المعيار هنا يضعه من يحكّم اللعبة.
  body:
    en: >-
      Ahmad Al-Nawaiseh judges professional bodybuilding internationally for the
      IFBB Pro League and the NPC, and certifies coaches at Mutah University.
      Nineteen years in the field, a master's in sports training, thirty-two
      completed courses.


      He chose the machines on this floor himself, one at a time, and set the
      way the place runs. The standard here comes from someone who decides what
      finished work looks like at the top of the sport — not from someone whose
      job is selling memberships.
    ar: >-
      أحمد النوايسة حَكَم دولي في IFBB Pro League و NPC، ومدرّب معتمد يمنح
      شهادات المدرّبين في جامعة مؤتة. تسعة عشر عاماً في المجال، وماجستير في
      التدريب الرياضي، واثنتان وثلاثون دورة مكتملة.


      اختار أجهزة هذه الصالة بنفسه، جهازاً جهازاً، ووضع طريقة إدارتها. المعيار
      هنا يأتي ممن يقرّر كيف يبدو العمل المكتمل في قمة اللعبة، لا ممن مهنته بيع
      الاشتراكات.
scale:
  kicker:
    en: The floor
    ar: الصالة
  headline:
    en: You never wait for a rack.
    ar: لن تنتظر دورك على أي جهاز.
  body:
    en: >-
      Two thousand square metres, more than 250 machines, 14 global brands. The
      pieces people queue for exist here more than once, so eight in the evening
      looks like any other hour.


      Free weights, plate-loaded, selectorised machines, cardio and a turf lane,
      each in its own zone with room to move between them. You can finish a full
      session without crossing the building.
    ar: >-
      ألفا متر مربع، وأكثر من 250 جهازاً، و14 علامة عالمية. الأجهزة التي يقف
      عليها الناس في الدور موجودة هنا بأكثر من نسخة، فتصبح الثامنة مساءً كأي
      ساعة أخرى.


      أوزان حرة، وأجهزة أقراص، وأجهزة أوزان، وكارديو، ومسار عشب — كل منطقة قائمة
      بذاتها ومساحة تتحرك فيها بينها. تستطيع إنهاء تمرينك كاملاً دون أن تقطع
      المبنى.
duration:
  kicker:
    en: Twenty hours a day
    ar: عشرون ساعة في اليوم
  headline:
    en: You don't visit Theeb. You spend the evening here.
    ar: لا تزور الذيب. تقضي فيه سهرتك.
  body:
    en: >-
      Train, then sit in Theeb Coffee House. Pick up what you need from KABS.
      Get your hair cut. Park at the door.


      Everything that would normally send you back out into traffic is already
      in the building, which is why people arrive for an hour and leave after
      three.
    ar: >-
      تتمرّن، ثم تجلس في مقهى الذيب. تأخذ ما تحتاجه من KABS. تحلق شعرك. تركن
      سيارتك أمام الباب.


      كل ما كان سيعيدك إلى الشارع موجود أصلاً داخل المبنى، ولهذا يأتي الناس
      لساعة ويخرجون بعد ثلاث.
closing:
  headline:
    en: One message is enough.
    ar: رسالة واحدة تكفي.
  body:
    en: >-
      There is no form to fill in and no account to open. Send us a message on
      WhatsApp and someone will answer you, usually within a few minutes.
    ar: >-
      لا يوجد نموذج تملؤه ولا حساب تفتحه. أرسل لنا رسالة على واتساب وسيجيبك
      أحدنا، غالباً خلال دقائق.
  tourNote:
    en: If you'd rather see the floor first, ask for a tour in the same message.
    ar: وإن كنت تفضّل أن ترى الصالة أولاً، اطلب جولة في الرسالة نفسها.
